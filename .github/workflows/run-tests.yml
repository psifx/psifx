name: run-tests

on:
  push:
    branches:
      - main
    paths:
      - 'psifx/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - 'psifx/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  run-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v4

      - name: Free up space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm
          df -h

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t psifx-test:${{ matrix.python-version }} .

      - name: Start container
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_SAM3: ${{ secrets.HF_TOKEN_SAM3 }}
        run: |
          TOKEN="${HF_TOKEN_SAM3:-$HF_TOKEN}"
          docker run -dit --name test-container \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e HF_TOKEN="$TOKEN" \
            psifx-test:${{ matrix.python-version }}
      
      - name: Install requirements
        run: |
          docker exec test-container pip install -r requirements-dev.txt
      
      - name: Run tests
        run: |
          docker exec test-container pytest -rs tests


      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f test-container
