name: release-access-readonly-check

on:
  workflow_dispatch:

jobs:
  check-release-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release token repository access
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY" --jq '{repository: .full_name, push_permission: .permissions.push}'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push')" = true
      - name: Verify Docker Hub authentication without publishing
        uses: docker/login-action@v3
        with:
          username: psifx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
