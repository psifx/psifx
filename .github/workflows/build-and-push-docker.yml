name: build-and-push-docker

on:
  release:
    types: [published]
  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-current-version.outputs.CURRENT_VERSION }}
    steps:
      - # remove the tool cache of a few versions of Python + PyPy https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md#hosted-tool-cache
        name: delete-unnecessary-tools
        id: delete-unnecessary-tools
        run: rm -rf /opt/hostedtoolcache
      -
        name: checkout
        id: checkout
        uses: actions/checkout@v4
      -
        name: get-current-version
        id: get-current-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CURRENT_VERSION=$(python3 -c "import psifx; print(psifx.__version__)")
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$CURRENT_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $CURRENT_VERSION" >&2
            exit 1
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
      -
        name: log-in-docker
        uses: docker/login-action@v3
        with:
          username: psifx
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: setup-qemu
        id: setup-qemu
        uses: docker/setup-qemu-action@v3
      -
        name: setup-docker-buildx
        id: setup-docker-buildx
        uses: docker/setup-buildx-action@v3
      -
        name: build-and-push
        id: build-and-push
        uses: docker/build-push-action@v5
        env:
          CURRENT_VERSION: ${{ steps.get-current-version.outputs.CURRENT_VERSION }}
        with:
          context: .
          build-args: |
            PYTHON_VERSION=3.11
          push: true
          no-cache: true
          tags: |
            psifx/psifx:${{ env.CURRENT_VERSION }}
            psifx/psifx:latest
          labels: |
            org.opencontainers.image.version=${{ env.CURRENT_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
  publish-docs:
    needs:
      - build-and-push
    runs-on: ubuntu-latest
    container:
      image: psifx/psifx:${{ needs.build-and-push.outputs.version }}
    permissions:
      id-token: write
      pages: write
    steps:
      -
        name: checkout
        id: checkout
        uses: actions/checkout@v4
      -
        name: install-packages
        id: test
        run: |
          pip install .[docs]
      -
        name: build-docs
        id: build-docs
        run: |
          sphinx-build --fresh-env --write-all docs public
      -
        name: upload-docs
        id: upload-docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      -
        name: deploy-docs
        id: deploy-docs
        uses: actions/deploy-pages@v4
